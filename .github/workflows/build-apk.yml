name: Build DSH Go APK (custom persona)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout upstream dsh-go
        uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-go
          path: dsh-go
          submodules: recursive

      - name: Checkout our persona overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Overlay persona
        run: |
          cp overlay/full-persona.js dsh-go/runtime/bridge/dsh-go-bridge/lib/companion/full-persona.js
          echo "--- head of patched file ---"
          head -15 dsh-go/runtime/bridge/dsh-go-bridge/lib/companion/full-persona.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install toolchain (Flutter / Android SDK / NDK)
        working-directory: dsh-go
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
          CURL_CA_BUNDLE: ''
        run: |
          set -x
          for attempt in 1 2 3; do
            echo "toolchain attempt $attempt"
            if bash tooling/setup-toolchain.sh; then
              echo "toolchain ok"; exit 0
            fi
            sleep 20
          done
          echo "toolchain failed after retries"; exit 1

      - name: Build runtime (arm64-v8a)
        working-directory: dsh-go
        run: |
          source tooling/env.sh
          bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        working-directory: dsh-go
        run: |
          source tooling/env.sh
          bash tooling/build-apk.sh -f arm64

      - name: Collect APK
        run: |
          mkdir -p out
          find dsh-go -name '*.apk' -not -path '*/build/intermediates/*' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-persona-apk
          path: out/*.apk
          if-no-files-found: error
