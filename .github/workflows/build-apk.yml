name: Build DSH Go APK (custom persona)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Checkout upstream dsh-go
        uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-go
          path: dsh-go
          submodules: recursive

      - name: Checkout our persona overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Overlay persona
        run: |
          cp overlay/full-persona.js dsh-go/runtime/bridge/dsh-go-bridge/lib/companion/full-persona.js
          grep -c "渴望外面世界" dsh-go/runtime/bridge/dsh-go-bridge/lib/companion/full-persona.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Prepare Android SDK bits
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" >/dev/null
          echo "sdk ready"

      - name: Build runtime (arm64-v8a)
        working-directory: dsh-go
        run: |
          bash runtime/build-runtime.sh arm64-v8a

      - name: Flutter pub get and build apk
        working-directory: dsh-go/app
        run: |
          flutter pub get
          timeout 10800 flutter build apk --debug --target-platform android-arm64 --verbose 2>&1 | tail -200

      - name: Collect APK
        run: |
          mkdir -p out
          find dsh-go -name '*.apk' -not -path '*/intermediates/*' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-persona-apk
          path: out/*.apk
          if-no-files-found: error
